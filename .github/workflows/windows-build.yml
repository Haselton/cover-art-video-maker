name: Build Windows Installer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish app
        run: dotnet publish CoverArtVideoMaker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName publish\ffmpeg.exe
      - name: Build installer
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Cover-Art-Video-Maker-Windows-Installer
          path: installer-output\Cover-Art-Video-Maker-Setup.exe
