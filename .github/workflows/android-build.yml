name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cover-art-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app and instrumentation APKs
        working-directory: android
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify APK signature and record its public certificate
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk > android/apk-signature-verification.txt
          cat android/apk-signature-verification.txt
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' android/apk-signature-verification.txt > android/signing-used.sha256
          grep -Eq '^[0-9a-fA-F]{64}$' android/signing-used.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export actual test videos on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: bash android/tests/run_instrumentation.sh
      - name: Verify codecs, pitch, frame timestamps, full endings and lossless AAC copy
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          python3 android/tests/verify_exports.py test-exports 2>&1 | tee verification-console.txt
      - name: Package verified APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/CoverArtVideoMaker-v1.2.0.apk
          cp test-exports/verification.json dist/Export-Verification.json
          cp android/signing-used.sha256 dist/Signing-Certificate-SHA256.txt
          cp android/apk-signature-verification.txt dist/APK-Signature-Verification.txt
          cp android/EXPORT_FIX.md dist/Export-Repair-Notes.md
          printf 'Cover Art Video Maker 1.2.0 (versionCode 3)\nCommit: %s\n' "$GITHUB_SHA" > dist/Build-Info.txt
          sha256sum dist/*.apk > dist/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cover-Art-Video-Maker-Android-APK
          path: dist/*
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cover-Art-Video-Maker-Export-Tests
          path: |
            android/signing-used.sha256
            android/apk-signature-verification.txt
            test-exports/
            test-logcat.txt
            instrumentation-results.txt
            verification-console.txt
            ui-launch.txt
            ui-hierarchy.xml
            ui-screenshot.png
          if-no-files-found: warn
