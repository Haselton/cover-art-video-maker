name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cover-art-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore development signing identity
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: cover-art-video-maker-debug-signing-v1
      - name: Initialize or verify development certificate
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            if [ -f android/signing-certificate.sha256 ]; then
              echo 'Signing key unavailable. Restore the original key; do not generate a replacement.'
              exit 1
            fi
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | sha256sum | cut -d ' ' -f 1 > android/signing-used.sha256
          cat android/signing-used.sha256
          if [ -f android/signing-certificate.sha256 ]; then
            diff -w android/signing-certificate.sha256 android/signing-used.sha256
          fi
      - name: Retain development signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: cover-art-video-maker-debug-signing-v1
      - name: Build app and instrumentation APKs
        working-directory: android
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export actual test videos on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: gradle -p android connectedDebugAndroidTest --stacktrace; RESULT=$?; adb logcat -d > test-logcat.txt; adb pull /sdcard/Android/data/com.haseltonmediagroup.coverartvideomaker/files/regression test-exports || true; exit $RESULT
      - name: Verify codecs, pitch, frame timestamps, full endings and lossless AAC copy
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 android/tests/verify_exports.py test-exports
      - name: Package verified APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/CoverArtVideoMaker-v1.2.0.apk
          cp test-exports/verification.json dist/Export-Verification.json
          cp android/signing-used.sha256 dist/Signing-Certificate-SHA256.txt
          printf 'Cover Art Video Maker 1.2.0 (versionCode 3)\nCommit: %s\n' "$GITHUB_SHA" > dist/Build-Info.txt
          sha256sum dist/*.apk > dist/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cover-Art-Video-Maker-Android-APK
          path: dist/*
          if-no-files-found: error
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cover-Art-Video-Maker-Export-Tests
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/signing-used.sha256
            test-exports/
            test-logcat.txt
          if-no-files-found: warn
